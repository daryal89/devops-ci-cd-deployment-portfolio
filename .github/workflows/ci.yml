name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Release Change Detection
    runs-on: ubuntu-latest

    outputs:
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect release-relevant changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" |
            grep -Eq '^(src/|Dockerfile$|\.dockerignore$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'
          then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            echo "Release-relevant change detected."
          else
            echo "runtime_changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-relevant change detected."
          fi

  quality:
    name: Application Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Audit dependencies
        run: npm audit

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Docker version
        run: docker --version

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build Docker image
        run: |
          docker build \
            --tag devops-ci-cd-portfolio:ci \
            .

  publish:
    name: Publish Container Image
    needs:
      - quality
      - docker
      - changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Deploy to Azure
    needs:
      - changes
      - publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runtime_changed == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest

    environment: production

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: rg-devops-portfolio-prod
      CONTAINER_APP: ca-devops-portfolio-api
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Derive immutable deployment identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPOSITORY}:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "revision_suffix=cd-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_id=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Deployment image: ${IMAGE_REPOSITORY}:sha-$SHORT_SHA"
          echo "Revision suffix: cd-$SHORT_SHA"
          echo "Build ID: sha-$SHORT_SHA"

      - name: Log in to Azure with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        shell: bash
        run: |
          set -euo pipefail

          az account show \
            --query '{Name:name,State:state}' \
            --output table

      - name: Deploy immutable image to Azure Container Apps
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.identity.outputs.image }}
          REVISION_SUFFIX: ${{ steps.identity.outputs.revision_suffix }}
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: |
          set -euo pipefail

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$DEPLOY_IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars BUILD_ID="$BUILD_ID" \
            --output none

      - name: Verify Azure deployment state
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ steps.identity.outputs.image }}
          EXPECTED_SUFFIX: ${{ steps.identity.outputs.revision_suffix }}
          EXPECTED_BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: |
          set -euo pipefail

          READY=false

          for ATTEMPT in {1..18}; do
            REVISION_NAME="$(az containerapp revision list \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, '$EXPECTED_SUFFIX')].name | [0]" \
              --output tsv)"

            PROVISIONING_STATE="$(az containerapp revision list \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, '$EXPECTED_SUFFIX')].properties.provisioningState | [0]" \
              --output tsv)"

            HEALTH_STATE="$(az containerapp revision list \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, '$EXPECTED_SUFFIX')].properties.healthState | [0]" \
              --output tsv)"

            ACTIVE_STATE="$(az containerapp revision list \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?contains(name, '$EXPECTED_SUFFIX')].properties.active | [0]" \
              --output tsv)"

            echo "Attempt $ATTEMPT/18"
            echo "Revision: $REVISION_NAME"
            echo "Provisioning: $PROVISIONING_STATE"
            echo "Health: $HEALTH_STATE"
            echo "Active: $ACTIVE_STATE"

            if [[ "$PROVISIONING_STATE" == "Provisioned" &&
                  "$HEALTH_STATE" == "Healthy" &&
                  "$ACTIVE_STATE" == "true" ]]
            then
              READY=true
              break
            fi

            if [[ "$ATTEMPT" -lt 18 ]]; then
              sleep 10
            fi
          done

          if [[ "$READY" != "true" ]]; then
            echo "Deployment did not become healthy in the expected time."
            exit 1
          fi

          ACTUAL_IMAGE="$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.template.containers[0].image \
            --output tsv)"

          ACTUAL_BUILD_ID="$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].env[?name==\`BUILD_ID\`].value | [0]' \
            --output tsv)"

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Actual image:   $ACTUAL_IMAGE"
          echo "Expected BUILD_ID: $EXPECTED_BUILD_ID"
          echo "Actual BUILD_ID:   $ACTUAL_BUILD_ID"

          [[ "$ACTUAL_IMAGE" == "$EXPECTED_IMAGE" ]]
          [[ "$ACTUAL_BUILD_ID" == "$EXPECTED_BUILD_ID" ]]

          echo "PASS: immutable Azure deployment verified"
